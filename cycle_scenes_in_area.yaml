blueprint:
  name: Cycle Scenes in Area
  description: >
    ## 🎬✨ Hue-like scene cycling for your remotes (and motion sensors)!

    This powerful script automatically cycles through scenes in any area based on activation timestamps. 
    Just press a button and watch your lights smoothly transition through your scenes! 🎨💡

    ### 🚀 **Default Scene**
    - The default scene is used if the lights have been off for longer than the specified time.
    - Use the oldest available Scene Studio scene in the area (entity-registry registration order, not last activation).
    - Fall back to the oldest available scene from another integration; no labels are required.
    - If `input_text.{area_id}_midlertidig_scene` holds `name|area,area` and those areas are not all dark for **Use default scene after**, that named scene is used instead. The area list is not a light group (`area_entities` at check time). A missing helper changes nothing.

    ### 🎯 **Use cases:**
    - Add scene cycling to remotes!
    - With Scene Studio, the area's oldest available scene is selected automatically.

  source_url: https://github.com/etokheim/home-assistant-scripts/blob/master/cycle_scenes_in_area.yaml
  domain: script

  input:
    transition:
      name: Transition time
      description: Transition time when switching between scenes
      default: 1
      selector:
        number:
          min: 0
          max: 10
          step: 0.1
          unit_of_measurement: s

    default_scene_after:
      name: "Use default scene after"
      description: "When all the lights in the area has been off for the specified time, the default scene is used instead of just turning the lights back on."
      default: 60
      selector:
        number:
          min: 0
          max: 120
          step: 1
          unit_of_measurement: m

    excluded_scenes:
      name: Excluded Scenes
      description: Scenes to be excluded from cycling.
      default: []
      selector:
        entity:
          domain: scene
          multiple: true

    advanced_settings:
      name: Advanced settings
      collapsed: true
      input:
        use_alphabetical_order:
          name: "Alphabetical order"
          description: "(Based on friendly_name). If off, the sorting will be based on activation time. (Last activated will be next)."
          default: true
          selector:
            boolean:

        power_on_to_last_used_scene:
          name: "Power on to last used scene"
          description: "When the lights are off, turn on to the last used scene? Defaults to turning the lights on to their previous state. I recommend off, so that the lights are turned back on with any customizations intact."
          default: false
          selector:
            boolean:

        power_on_to_default_scene_if_last_activated:
          name: "Power on to the default scene, if that was the last activated?"
          description: "Meant to be used with Scene Studio. Same idea as `Power on to last used scene`, but only if the automatically selected default was the last activated scene. Overrides on that scene are not restored when the lights come back on."
          default: true
          selector:
            boolean:

fields:
  area_id:
    selector:
      area: {}
    description: The area where you want to toggle scenes
    name: Area
    required: true

mode: queued

variables:
  excluded_scenes: !input excluded_scenes
  default_scene_after: !input default_scene_after
  use_alphabetical_order: !input use_alphabetical_order
  power_on_to_last_used_scene: !input power_on_to_last_used_scene
  power_on_to_default_scene_if_last_activated: !input power_on_to_default_scene_if_last_activated

sequence:
  - variables:
      # We use a separate variable section here, instead of the one above to define our variables because it's not possible
      # to reference other variables created in the same section in the variable definition section above. In an variable
      # action slot, as we have here, that works fine however. (Example. "var1: 1, var2: var1 + 1")

      default_scene: >-
        {# Registry order is oldest registration first, independent of activations. #}
        {% set available = states.scene | rejectattr('state', 'eq', 'unavailable') | map(attribute='entity_id') | list %}
        {% set candidates = area_entities(area_id) | select('in', available) | list %}
        {% set ns = namespace(titles=[], studio=[]) %}
        {% for scene in candidates %}
          {% set entry = config_entry_id(scene) %}
          {% if entry and config_entry_attr(entry, 'domain') == 'scene_studio' %}
            {% set title = config_entry_attr(entry, 'title') %}
            {% if title not in ns.titles %}{% set ns.titles = ns.titles + [title] %}{% endif %}
          {% endif %}
        {% endfor %}
        {% for title in ns.titles %}
          {% set ns.studio = ns.studio + (integration_entities(title) | select('in', candidates) | list) %}
        {% endfor %}
        {{ ns.studio[0] if ns.studio else (candidates[0] if candidates else '') }}

      area_scenes: >
        {{ states.scene
          | selectattr('entity_id', 'in', area_entities(area_id))
          | rejectattr('state', 'eq', 'unavailable')
          | map(attribute='entity_id')
          | list
        }}

      scenes_to_handle: "{{ (area_scenes | reject('in', excluded_scenes) | list) }}"

      scenes_sorted_by_activation_time: >-
        {% set ns = namespace(scenes=[]) %}
        {% for scene in expand(scenes_to_handle) | rejectattr('state', 'eq', 'unavailable') %}
          {% set timestamp = as_timestamp(scene.state, 0) %}
          {% if timestamp > 0 %}{% set ns.scenes = ns.scenes + [{'id': scene.entity_id, 'timestamp': timestamp}] %}{% endif %}
        {% endfor %}
        {{ ns.scenes | sort(attribute='timestamp', reverse=true) | map(attribute='id') | list }}

      scenes_with_default_scene_sorted_by_activation_time: >-
        {% set with_default = scenes_to_handle + ([default_scene] if default_scene else []) %}
        {% set ns = namespace(scenes=[]) %}
        {% for scene in expand(with_default) | rejectattr('state', 'eq', 'unavailable') %}
          {% set timestamp = as_timestamp(scene.state, 0) %}
          {% if timestamp > 0 %}{% set ns.scenes = ns.scenes + [{'id': scene.entity_id, 'timestamp': timestamp}] %}{% endif %}
        {% endfor %}
        {{ ns.scenes | sort(attribute='timestamp', reverse=true) | map(attribute='id') | list }}

      last_activated_scene: >
        {% if scenes_sorted_by_activation_time | length > 0 %}
          {{ scenes_sorted_by_activation_time[0] }}
        {% else %}
          {{ '' }}
        {% endif %}
      index_of_last_activated_scene: >
        {% if scenes_to_handle | length > 0 and last_activated_scene in scenes_to_handle %}
          {{ scenes_to_handle.index(last_activated_scene) }}
        {% else %}
          -1
        {% endif %}
      last_activated_scene_with_default_scene: >
        {% if scenes_with_default_scene_sorted_by_activation_time | length > 0 %}
          {{ scenes_with_default_scene_sorted_by_activation_time[0] }}
        {% else %}
          {{ default_scene }}
        {% endif %}

      # True if any of the lights in the specified area is on
      lights_on: >
        {%-
          set lights = states.light 
            | selectattr('entity_id', 'in', area_entities(area_id))
            | selectattr("state", "eq", "on")
            | map(attribute='entity_id')
            | list
        -%}
        {{ lights | length != 0 }}

  - if:
      - condition: template
        value_template: "{{ area_scenes | length == 0 }}"
    then:
      - action: light.turn_on
        target:
          area_id: "{{ area_id }}"
        data:
          transition: !input transition
      - stop: No available scenes; turned on the area's lights

  - if:
      - condition: template
        value_template: "{{ lights_on }}"

    then:
      - alias: Cycle to the next scene (turns on the next scene in the order)
        service: scene.turn_on
        data:
          transition: !input transition
        target:
          entity_id: >
            {% if scenes_to_handle | length > 0 %}
              {% if use_alphabetical_order == true %}

              {#- Return next in the list, but if it reaches the end of the list, wrap around to the first item instead -#}
              {{ scenes_to_handle[(index_of_last_activated_scene + 1) % (scenes_to_handle | count)] }}

              {% else %}

                {% set unknown_scenes = expand(scenes_to_handle) | selectattr('state', 'eq', 'unknown') | map(attribute='entity_id') | list %}
                
                {% if unknown_scenes | count > 0 %}
                  {{ unknown_scenes[0] }}
                {% else %}
                  {% set known_scenes = scenes_sorted_by_activation_time | reverse | list %}
                  {% if known_scenes | length > 0 %}
                    {{ known_scenes[0] }}
                  {% else %}
                    {{ default_scene }}
                  {% endif %}
                {% endif %}

              {% endif %}
            {% else %}
              {{ default_scene }}
            {% endif %}

    else:
      # Temporary scene from sett_felles_scene: "<friendly name>|<area_id>,..."
      # Same name match as that script (area prefix stripped, case-insensitive).
      # Expiry watches area_entities lights in the stored areas, not an HA group.
      - variables:
          override_info: >
            {% set raw = states('input_text.' ~ area_id ~ '_midlertidig_scene') %}
            {% if raw in ['unknown', 'unavailable', 'none', ''] or '|' not in raw %}
            {% else %}
              {% set scene_key = raw.split('|')[0] | trim | lower %}
              {% set group_areas = raw.split('|')[1].split(',') | map('trim') | reject('eq', '') | list %}
              {% set ns = namespace(any_on=false, latest=0, count=0) %}
              {% for gid in group_areas %}
                {% for light in states.light | selectattr('entity_id', 'in', area_entities(gid)) | list %}
                  {% if 'entity_id' not in light.attributes %}
                    {% set ns.count = ns.count + 1 %}
                    {% if light.state == 'on' %}
                      {% set ns.any_on = true %}
                    {% else %}
                      {% set ts = as_timestamp(light.last_changed) | float(0) %}
                      {% if ts > ns.latest %}{% set ns.latest = ts %}{% endif %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
              {% endfor %}
              {% set age = as_timestamp(now()) - ns.latest %}
              {% set expired = (not ns.any_on) and ns.count > 0 and ns.latest > 0 and (age >= (default_scene_after | float(0) * 60)) %}
              {% set an = area_name(area_id) %}
              {% set alow = an | lower %}
              {% set found = namespace(items=[]) %}
              {% for scene in states.scene | selectattr('entity_id', 'in', area_entities(area_id)) | map(attribute='entity_id') | list %}
                {% set sraw = state_attr(scene, 'friendly_name') | default('') | trim %}
                {% set low = sraw | lower %}
                {% if low == alow %}
                  {% set stripped = sraw %}
                {% elif low.startswith(alow ~ ' ') or low.startswith(alow ~ '-') or low.startswith(alow ~ ':') or low.startswith(alow ~ '–') %}
                  {% set stripped = sraw[an|length:] | regex_replace('^[\s\-–:]+', '') | trim %}
                {% else %}
                  {% set stripped = sraw %}
                {% endif %}
                {% if stripped | lower == scene_key %}
                  {% set found.items = found.items + [scene] %}
                {% endif %}
              {% endfor %}
              {% set matched = found.items[0] if found.items | length == 1 else '' %}
              {{ matched }}|{{ 'yes' if expired else 'no' }}
            {% endif %}
      - if:
          - alias: Temporary scene still applies
            condition: template
            value_template: >
              {{
                '|' in override_info
                and (override_info.split('|')[0] | length > 0)
                and (override_info.split('|')[1] != 'yes')
              }}
        then:
          - alias: Turn on the remembered scene
            action: scene.turn_on
            data:
              transition: !input transition
            target:
              entity_id: "{{ override_info.split('|')[0] }}"
          - stop: Temporary scene applied
      - if:
          - alias: Whole stored area set has been dark long enough
            condition: template
            value_template: "{{ '|' in override_info and override_info.endswith('|yes') }}"
        then:
          - action: input_text.set_value
            target:
              entity_id: "{{ 'input_text.' ~ area_id ~ '_midlertidig_scene' }}"
            data:
              value: ""
      - variables:
          turned_off_light_ids: >
            {#- First we'll find the area's turned off lights -#}
            {#- TODO: This isnt stored as a list, but a string. It works, but only in order to check whether the length is 0 or more -#}
            {{ states.light
                | selectattr("state", "eq", "off")
                | selectattr('entity_id', 'in', area_entities(area_id))
                | map(attribute="entity_id")
                | list
            }}

          lights_on: >
            {{
              states.light 
                | selectattr('entity_id', 'in', area_entities(area_id))
                | selectattr("state", "eq", "on")
                | map(attribute='entity_id')
                | list
                | length != 0
            }}

          last_turned_off_light_id: >
            {%- if not lights_on and turned_off_light_ids | length > 0 -%}
              {#
                Then we'll loop over the lights to figure out which of them was turned off last
              #}

              {# We have to use a namespace to be able to update the variable, as the for loop is scoped #}
              {%- set last_turned_off = namespace(
                    candidate = states[turned_off_light_ids[0]]
                  )
              -%}
              {%- set last_turned_off.candidate = states[turned_off_light_ids[0]] -%}

              {%- for light_id in turned_off_light_ids -%}
                {%- set new_candidate = states[light_id] -%}

                {%- if as_timestamp(new_candidate.last_changed) > as_timestamp(last_turned_off.candidate.last_changed) -%}
                  {%- set last_turned_off.candidate = new_candidate -%}
                {%- endif -%}

              {%- endfor -%}

              {{ last_turned_off.candidate.entity_id }}
            {%- endif -%}

          seconds_since_the_last_light_turned_off: >
            {%- if last_turned_off_light_id -%}
              {{ as_timestamp(now()) - as_timestamp(states[last_turned_off_light_id].last_changed) }}
            {%- endif -%}

      - if:
          - alias: If the lights are off, and have been for longer than `default_scene_after`
            condition: and
            conditions:
              - condition: template
                value_template: "{{ not lights_on }}"

              - condition: template
                value_template: >
                  {{ seconds_since_the_last_light_turned_off | int(0) >= default_scene_after * 60 }}

              - condition: template
                value_template: "{{ default_scene | length > 0 }}"

        then:
          - alias: Then activate the default scene
            service: scene.turn_on
            data:
              transition: !input transition
            target:
              entity_id: "{{ default_scene }}"

        else:
          - choose:
              - alias: Else, if the power_on_to_last_used_scene is true, activate the last used scene
                conditions: "{{ power_on_to_last_used_scene | bool(false) and last_activated_scene | length > 0 }}"
                sequence:
                  - service: scene.turn_on
                    data:
                      transition: !input transition
                    target:
                      entity_id: "{{ last_activated_scene }}"

              - alias: Else, we turn the lights on as they were before they were turned off
                conditions: []
                sequence:
                  - if:
                      - alias: If the last activated scene before the lights turned off was the `default_scene` and `power_on_to_default_scene_if_last_activated` is true
                        condition: template
                        value_template: "{{ default_scene and last_activated_scene_with_default_scene == default_scene and power_on_to_default_scene_if_last_activated }}"

                    then:
                      - alias: Then activate the default scene
                        service: scene.turn_on
                        data:
                          transition: !input transition
                        target:
                          entity_id: "{{ default_scene }}"

                    else:
                      - alias: Else, we turn the lights on as they were before they were turned off
                        service: light.turn_on
                        data:
                          transition: !input transition
                        target:
                          entity_id: >
                            {%-
                              set area = namespace(
                                lights=states.light
                                  | selectattr("state", "eq", "off")
                                  | selectattr('entity_id', 'in', area_entities(area_id))
                                  | list,
                                  
                                turned_off_last=[]
                              )
                            -%}

                            {#-
                              Remove any light groups from the list.
                              (If any light in a group is on, the group is on. And since we are turning on all the lights that were on, the group would also be turned on. Turning the group on, results in all the lights in it being turned on, but that's not always what we want. We just want to turn on what was actually already on).
                            -#}
                            {%- for light in area.lights -%}
                              {#- The only way to identify a group is by whether or not it has an attribute with entity_id (notice it's an attribute, not the group's entity_id) -#}
                              {%- if "entity_id" in light.attributes -%}
                                {% set area.lights = area.lights | rejectattr("entity_id", "eq", light.entity_id) %} 
                              {%- endif -%}
                            {%- endfor -%}

                            {% for light in area.lights -%}

                              {%- if area.turned_off_last | length == 0 -%}
                                {%- set area.turned_off_last = [light] -%}
                              {%- else -%}
                              
                                {#- Put all the lights that were turned off at the same time (or within 2 seconds of each other) in the same list -#}
                                {% set time_difference = (as_timestamp(area.turned_off_last[0].last_changed) - as_timestamp(light.last_changed)) %}
                                {% if time_difference <= -2 %}
                                  {% set area.turned_off_last = [light] %}
                                {% elif time_difference < 2 %}
                                  {% set area.turned_off_last = area.turned_off_last + [light] %}
                                {%- endif -%}
                                
                              {%- endif -%}
                            {%- endfor -%}

                            {{ area.turned_off_last | map(attribute='entity_id') | list }}
